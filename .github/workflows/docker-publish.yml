name: Publish Docker image

on:
  push:
    branches:
      - main
  # Weekly rebuild, so the image's Debian packages (ffmpeg, 7-Zip) and Python base get
  # security updates even when nothing is pushed
  schedule:
    - cron: "0 4 * * 1"
  # A "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # Actions are pinned to exact commits (the release they are is noted), so a moved tag
      # can't change what runs with the package-publishing token
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          pull: true # The newest python:3.11-slim, with its security updates
          no-cache: ${{ github.event_name == 'schedule' }} # Weekly: fresh apt packages too
          tags: ghcr.io/epurl/audiobookbay-torznab:latest
