version: '3.8'

services:
  audiobookbay-torznab:
    build: .
    container_name: audiobookbay-torznab
    ports:
      - "8000:8000"
    environment:
      # Put secrets in a .env file next to this one (see .env.example); never commit them
      - ABB_COOKIE=${ABB_COOKIE:-}
      - ABB_USER_AGENT=${ABB_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36}
      - BAYARR_USERNAME=${BAYARR_USERNAME:-}
      - BAYARR_PASSWORD=${BAYARR_PASSWORD:-}
    volumes:
      - ./config:/config
      # Your audiobooks and qBittorrent's downloads (imports are copied from one to the other):
      # - /path/to/audiobooks:/audiobooks
      # - /path/to/qbittorrent/downloads:/downloads
    restart: unless-stopped
